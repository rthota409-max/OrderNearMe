<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OrderNearMe — Order together. Save together.</title>
    <meta name="theme-color" content="#1a73e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OrderNearMe" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW registration skipped', err));
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'media',
        theme: {
          extend: {
            colors: {
              google: {
                blue: '#1a73e8',
                blueHover: '#1557b0',
                blueLight: '#e8f0fe',
                blueContainer: '#c2e7ff',
                blueText: '#041e49',
                green: '#188038',
                greenLight: '#e6f4ea',
                greenContainer: '#c4eed0',
                amber: '#f9ab00',
                amberLight: '#fef7e0',
                amberContainer: '#ffe7a5',
                red: '#d93025',
                redLight: '#fce8e6',
                surface: '#f8f9fa',
                surfaceVariant: '#e8eaed',
                outline: '#dadce0',
                text: '#202124',
                secondary: '#5f6368',
                darkSurface: '#1f1f1f',
                darkCard: '#2d2e31',
                darkBorder: '#3c4043',
                darkText: '#e8eaed',
                darkSecondary: '#9aa0a6'
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'Roboto', 'system-ui', 'sans-serif']
            },
            boxShadow: {
              'm3-1': '0 1px 3px 1px rgba(60,64,67,0.12), 0 1px 2px 0 rgba(60,64,67,0.24)',
              'm3-2': '0 2px 6px 2px rgba(60,64,67,0.12), 0 1px 2px 0 rgba(60,64,67,0.24)',
              'm3-3': '0 4px 8px 3px rgba(60,64,67,0.12), 0 1px 3px 0 rgba(60,64,67,0.24)',
              'm3-float': '0 6px 12px 4px rgba(60,64,67,0.15), 0 2px 4px 0 rgba(60,64,67,0.25)'
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        color-scheme: light dark;
      }
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8f9fa;
        color: #202124;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1f1f1f;
          color: #e3e3e3;
        }
      }
      /* Fix native select options dropdown styling across dark and light modes */
      select, option {
        color-scheme: light dark;
        background-color: #ffffff;
        color: #202124;
      }
      @media (prefers-color-scheme: dark) {
        select, option {
          background-color: #2d2e31;
          color: #e8eaed;
        }
      }
      /* Hide scrollbars cleanly for horizontal carousels */
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
      /* Button press feedback */
      button, a, input, select, textarea {
        transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: var(--ease-standard);
        transition-duration: 180ms;
      }
      button:active {
        transform: scale(0.97);
      }
      /* Material 3 Bottom Sheet animations */
      @keyframes m3SlideUp {
        from {
          transform: translateY(100%);
          opacity: 0.8;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-m3-slide-up {
        animation: m3SlideUp 260ms var(--ease-standard) forwards;
      }
      @keyframes m3FadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-m3-fade-in {
        animation: m3FadeIn 200ms var(--ease-standard) forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
